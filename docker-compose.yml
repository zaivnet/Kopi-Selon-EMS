version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kopi-selon-ems
    restart: always
    ports:
      - "${PORT:-3333}:3333"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3333
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
